[package]
name = "qen"
version = "0.1.0"
description = "allocator/memory subsystem for simulation/ECS"
repository = "https://github.com/bin/qen"
readme = "README.md"
# Unlicensed, experimental, and not meant for crates.io.
publish = false
edition = "2024"

[lib]
# Qen is a Rust library. Native benchmark consumers link the dedicated
# `bench/qen-adapter` staticlib, so forcing every Rust dependency build to also
# produce dylib/staticlib artifacts only creates duplicate outputs and can make
# downstream release profiles fail when their panic/link strategies differ.
crate-type = ["rlib"]

[features]
default = []
stats = []
# Retain allocator canaries, deterministic zeroing, bounds checks, and
# ownership assertions in optimized builds.
hardened = []

[dependencies]
fixedbitset = "0.5.7"
libc = "0.2.180"
portable-atomic = "1.13.1"

[lints.rust]
# Groups get priority -1 so individual lints below can override them
# (cargo warns about ambiguous same-priority group/lint mixes otherwise).
future_incompatible = { level = "deny", priority = -1 }
deprecated_safe = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
# `unused` stays at its default (warn): CI enforces `-D warnings` on the
# check/test steps instead, so local builds don't hard-fail while iterating.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(miri)'] }

unsafe_op_in_unsafe_fn = "deny"
unsafe_attr_outside_unsafe = "deny"
missing_unsafe_on_extern = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[target.'cfg(loom)'.dependencies]
# Patched w/128-bit atomic support
loom = { git = "https://github.com/bin/loom.git" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
